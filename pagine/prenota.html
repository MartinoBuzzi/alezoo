<header class="hero page-hero">
  <div class="hero-inner">
    <h1>Prenotazioni eventi</h1>
  </div>
</header>

<section>
  <div class="container-narrow" style="max-width: 640px;">
    <form class="zoo-form" id="bookingForm" action="#" method="post" role="form" aria-label="Modulo di contatto per prenotazioni">
      <div class="form-feedback" id="formFeedback"></div>

      <label for="nome">Nome e Cognome</label>
      <input type="text" id="nome" name="nome" required aria-required="true">
      <span class="field-error" id="nomeError"></span>

      <label for="email">Indirizzo Email</label>
      <input type="email" id="email" name="email" required aria-required="true">
      <span class="field-error" id="emailError"></span>

      <label for="telefono">Numero di Telefono</label>
      <input type="tel" id="telefono" name="telefono">
      <span class="field-error" id="telefonoError"></span>

      <label for="evento">Evento a cui vuoi partecipare</label>
      <input type="text" id="evento" name="evento">

      <label for="messaggio">Messaggio (opzionale)</label>
      <textarea id="messaggio" name="messaggio" rows="4"></textarea>

      <div style="text-align:center;">
        <button type="submit" class="btn-zoo btn-zoo-primary">Invia Prenotazione</button>
      </div>
    </form>
  </div>
</section>
